[project]
name = "workflow-orchestrator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dbos>=2.25.0",
    "fastapi[standard]>=0.136.3",
    "uvicorn>=0.49.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg",
    "sqlalchemy[asyncio]>=2.0.51",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 112

[tool.ruff.lint]
select = [
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # isort
    "I",
    # flake8-bugbear
    "B",
    # pyupgrade
    "UP",
    # flake8-simplify
    "SIM",
]
fixable = ["ALL"]

[tool.ruff.format]
line-ending = "native"
indent-style = "space"
docstring-code-format = true
