[project]
name = "harvest-backend"
version = "0.1.0"
description = "Harvest Workflow Orchestrator backend (FastAPI + DBOS durable execution)"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "dbos>=2.23.0",
    "geopandas>=1.1.4",
    "pyogrio>=0.13.0",
    "itsdangerous>=2.2.0",
    # annotation_adapter._image_sizes imports PIL to read each referenced image's
    # pixel dimensions. It was listed in requirements.txt but never here, so it
    # was absent from uv.lock and from any environment built from this file —
    # fine locally, where the venv happened to have it, but a container built
    # from the lock would 500 on every coco/yolo conversion.
    "pillow>=11.0",
]

[tool.uv]
package = false
