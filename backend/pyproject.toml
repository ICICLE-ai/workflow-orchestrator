[project]
name = "harvest-backend"
version = "0.1.0"
description = "Harvest Workflow Orchestrator backend (FastAPI + DBOS durable execution)"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.15",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "dbos>=2.23.0",
]

[tool.uv]
package = false
