name: Repository health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required-project-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify contribution-readiness files
        run: |
          required_files=(
            "LICENSE"
            "README.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "CITATION.cff"
            "docs/RELEASE_CHECKLIST.md"
            "docs/MAINTAINER_ROLES.md"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required project file: $file"
              missing=1
            fi
          done
          exit "$missing"
