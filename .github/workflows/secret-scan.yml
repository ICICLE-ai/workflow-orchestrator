name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  # Detection rules improve over time, so rescan the full history weekly
  # rather than only scanning what each change happens to touch.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Detect secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      # Pinned rather than resolved from the releases API: that call is
      # unauthenticated and rate limited per runner IP, and an unpinned
      # major version could drop the CLI flags used below.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets
        env:
          # Passed through the environment instead of interpolated into the
          # script body, so workflow inputs can never become shell syntax.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # `gitleaks detect` is deprecated upstream in favour of `gitleaks git`.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Only the commits the pull request adds.
            gitleaks git . --log-opts "${BASE_SHA}..${HEAD_SHA}" --redact
          else
            gitleaks git . --redact
          fi

  trufflehog:
    name: Detect secrets (trufflehog)
    # The action only derives a commit range for push and pull_request events.
    # On schedule and workflow_dispatch it passes empty base and head values,
    # which collapse into a malformed `--since-commit --branch` argument pair,
    # so the periodic full-history rescan is left to the gitleaks job above.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        # Pinned to the commit tagged v3.97.0. Tracking @main would run
        # whatever upstream lands, unreviewed, inside this repository's CI.
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318
        with:
          path: ./
          version: "3.97.0"
          # base and head are deliberately unset. Setting either one forces the
          # action's manual-range path, where an empty base emits
          # `--since-commit --branch HEAD` and the scan fails to parse; leaving
          # them empty lets the action pick the correct range per event type.
          #
          # --results keeps findings whose verification was inconclusive, which
          # --only-verified would silently discard along with any real
          # credential whose verification request happened to fail.
          extra_args: --results=verified,unknown
